name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: R and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up R from renv.lock
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true

      - name: Install R system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran libblas-dev liblapack-dev \
            cmake libuv1-dev zlib1g-dev

      - name: Restore locked R packages
        uses: r-lib/actions/setup-renv@v2

      - name: Run R tests
        run: Rscript --vanilla tests/run_all.R

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        working-directory: tests/browser
        run: npm test

      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-test-failures
          path: tests/browser/test-results/
          if-no-files-found: ignore
          retention-days: 7
